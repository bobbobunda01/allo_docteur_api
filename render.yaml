services:
  - type: web
    name: allodocteur-api
    runtime: docker
    plan: starter
    healthCheckPath: /v1/health
    autoDeploy: false
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: ALLODOCTEUR_LLM_ENABLED
        value: "true"
      - key: OPENAI_MAX_OUTPUT_TOKENS
        value: "1200"
      - key: OPENAI_REASONING_EFFORT
        value: minimal
      - key: OPENAI_TEXT_VERBOSITY
        value: low
      - key: OPENAI_READ_TIMEOUT_SECONDS
        value: "30"
      - key: OPENAI_MAX_RETRIES
        value: "0"
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: ALLOWED_HOSTS
        value: '["*"]'
      - key: CORS_ORIGINS
        value: '[]'
      - key: DEFAULT_COUNTRY
        value: République démocratique du Congo
      - key: ENABLE_EPIDEMIOLOGICAL_CONTEXT
        value: "true"
